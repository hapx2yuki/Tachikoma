[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    adafruit/Adafruit NeoPixel@^1.12.3
    dfrobot/DFRobotDFPlayerMini@^1.0.6
    esp32async/ESPAsyncWebServer@^3.7.0
    esp32async/AsyncTCP@^3.3.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; async_tcp タスク (デフォルト priority=10, どちらのコアでも実行可) が
    ; gait 制御ループ (priority=1, core1 固定) をプリエンプトしないよう
    ; core0 (Audio タスクと同じコア) へ明示的に固定する (AsyncTCP 推奨設定)
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
; キャリブレーション時 (明示した1軸だけを保護範囲内で出力) は次を有効化して書き込む
;    -DCALIBRATION_MODE

; 手持ち部品で進める初期構成。LED/74AHCT125とDFPlayer/microSDを未搭載にする。
; I2Sマイク/アンプ、腕/目、VBAT監視、全サーボの異常停止は通常版と同一。
[env:esp32dev_print_first]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DTACHIKOMA_PRINT_FIRST_PROFILE=1
    -DTACHIKOMA_STATUS_LEDS=0
    -DTACHIKOMA_DFPLAYER=0
    ; 1Wスピーカーの初回試験を小音量で始める。電気的1W制限の保証ではない。
    -DTACHIKOMA_AUDIO_VOLUME_PERCENT=25

; 単体サーボの校正用。起動時から中立パルスを出すので、機体一式には使わない。
[env:esp32dev_print_first_cal]
extends = env:esp32dev_print_first
build_flags =
    ${env:esp32dev_print_first.build_flags}
    -DCALIBRATION_MODE
