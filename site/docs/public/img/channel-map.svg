<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Zen Kaku Gothic New',sans-serif" font-size="13">
<rect width="900" height="470" fill="#fff"/>
<text x="20" y="30" font-weight="900" font-size="17">board0 = 0x40 (下段) — 脚 + 頭</text>
<g transform="translate(20,45)">
<g v="r"><rect width="410" height="26" fill="#1f2430"/><text x="30" y="18" fill="#fff" text-anchor="middle">ch</text><text x="230" y="18" fill="#fff" text-anchor="middle">サーボ</text></g>
<g font-size="13">
<rect y="26" width="410" height="24" fill="#fff0e6"/><text x="30" y="43" text-anchor="middle" font-weight="700">0</text><text x="70" y="43">FR 股ヨー</text>
<rect y="50" width="410" height="24" fill="#fff0e6"/><text x="30" y="67" text-anchor="middle" font-weight="700">1</text><text x="70" y="67">FR 股ピッチ</text>
<rect y="74" width="410" height="24" fill="#fff0e6"/><text x="30" y="91" text-anchor="middle" font-weight="700">2</text><text x="70" y="91">FR 膝</text>
<rect y="98" width="410" height="24" fill="#e9f5ec"/><text x="30" y="115" text-anchor="middle" font-weight="700">3</text><text x="70" y="115">FL 股ヨー</text>
<rect y="122" width="410" height="24" fill="#e9f5ec"/><text x="30" y="139" text-anchor="middle" font-weight="700">4</text><text x="70" y="139">FL 股ピッチ</text>
<rect y="146" width="410" height="24" fill="#e9f5ec"/><text x="30" y="163" text-anchor="middle" font-weight="700">5</text><text x="70" y="163">FL 膝</text>
<rect y="170" width="410" height="24" fill="#fff0e6"/><text x="30" y="187" text-anchor="middle" font-weight="700">6</text><text x="70" y="187">RL 股ヨー</text>
<rect y="194" width="410" height="24" fill="#fff0e6"/><text x="30" y="211" text-anchor="middle" font-weight="700">7</text><text x="70" y="211">RL 股ピッチ</text>
<rect y="218" width="410" height="24" fill="#fff0e6"/><text x="30" y="235" text-anchor="middle" font-weight="700">8</text><text x="70" y="235">RL 膝</text>
<rect y="242" width="410" height="24" fill="#e9f5ec"/><text x="30" y="259" text-anchor="middle" font-weight="700">9</text><text x="70" y="259">RR 股ヨー</text>
<rect y="266" width="410" height="24" fill="#e9f5ec"/><text x="30" y="283" text-anchor="middle" font-weight="700">10</text><text x="70" y="283">RR 股ピッチ</text>
<rect y="290" width="410" height="24" fill="#e9f5ec"/><text x="30" y="307" text-anchor="middle" font-weight="700">11</text><text x="70" y="307">RR 膝</text>
<rect y="314" width="410" height="24" fill="#f3f0ff"/><text x="30" y="331" text-anchor="middle" font-weight="700">12</text><text x="70" y="331">頭部ヨー (SG90 · 駆動対象は未確定 → 未接続で OK)</text>
<rect y="338" width="410" height="24" fill="#f4f4f4"/><text x="30" y="355" text-anchor="middle">13-15</text><text x="70" y="355" fill="#777">予備</text>
</g>
<text x="0" y="385" font-size="12" fill="#555">ch は左から順に GND / V+ / PWM の 3 ピン列。数字は基板の印字と同じ</text>
</g>
<text x="470" y="30" font-weight="900" font-size="17">board1 = 0x41 (上段) — 腕 + 目</text>
<g transform="translate(470,45)">
<rect width="410" height="26" fill="#1f2430"/><text x="30" y="18" fill="#fff" text-anchor="middle">ch</text><text x="230" y="18" fill="#fff" text-anchor="middle">サーボ</text>
<g font-size="13">
<rect y="26" width="410" height="24" fill="#fff0e6"/><text x="30" y="43" text-anchor="middle" font-weight="700">0</text><text x="70" y="43">右肩ヨー</text>
<rect y="50" width="410" height="24" fill="#fff0e6"/><text x="30" y="67" text-anchor="middle" font-weight="700">1</text><text x="70" y="67">右肩ピッチ</text>
<rect y="74" width="410" height="24" fill="#fff0e6"/><text x="30" y="91" text-anchor="middle" font-weight="700">2</text><text x="70" y="91">右肘</text>
<rect y="98" width="410" height="24" fill="#f4f4f4"/><text x="30" y="115" text-anchor="middle">3</text><text x="70" y="115" fill="#777">(空き — 旧グリッパ)</text>
<rect y="122" width="410" height="24" fill="#e9f5ec"/><text x="30" y="139" text-anchor="middle" font-weight="700">4</text><text x="70" y="139">左肩ヨー</text>
<rect y="146" width="410" height="24" fill="#e9f5ec"/><text x="30" y="163" text-anchor="middle" font-weight="700">5</text><text x="70" y="163">左肩ピッチ</text>
<rect y="170" width="410" height="24" fill="#e9f5ec"/><text x="30" y="187" text-anchor="middle" font-weight="700">6</text><text x="70" y="187">左肘</text>
<rect y="194" width="410" height="24" fill="#f4f4f4"/><text x="30" y="211" text-anchor="middle">7</text><text x="70" y="211" fill="#777">(空き — 旧グリッパ)</text>
<rect y="218" width="410" height="24" fill="#f3f0ff"/><text x="30" y="235" text-anchor="middle" font-weight="700">8</text><text x="70" y="235">右目ポッド</text>
<rect y="242" width="410" height="24" fill="#f4f4f4"/><text x="30" y="259" text-anchor="middle">9</text><text x="70" y="259" fill="#777">(空き — 中央目はカメラ)</text>
<rect y="266" width="410" height="24" fill="#f3f0ff"/><text x="30" y="283" text-anchor="middle" font-weight="700">10</text><text x="70" y="283">左目ポッド</text>
<rect y="290" width="410" height="48" fill="#ffe7e7"/><text x="30" y="318" text-anchor="middle">11-15</text><text x="70" y="311" fill="#b3202a" font-weight="700">使わない (南端 4ch は</text><text x="70" y="329" fill="#b3202a" font-weight="700">プラグを挿さない — 頭シェルと干渉)</text>
</g>
<text x="0" y="385" font-size="12" fill="#555">ファームウェア内の番号 = 16 + ch (例: 右目 = 24)</text>
</g>
<text x="20" y="455" font-size="12" fill="#555">FR = 右前, FL = 左前, RL = 左後, RR = 右後。右 = ロボットの右 (+X)</text>
</svg>
