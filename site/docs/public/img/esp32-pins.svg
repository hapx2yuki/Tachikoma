<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Zen Kaku Gothic New',sans-serif" font-size="14">
<rect width="860" height="520" fill="#fff"/>
<rect x="300" y="40" width="260" height="440" rx="14" fill="#2b2f3a" stroke="#1f2430" stroke-width="3"/>
<rect x="380" y="20" width="100" height="40" rx="6" fill="#8b95a5"/><text x="430" y="46" text-anchor="middle" font-size="12" fill="#fff">USB (書き込み)</text>
<rect x="360" y="100" width="140" height="80" rx="6" fill="#4a4f5c"/><text x="430" y="145" text-anchor="middle" fill="#fff" font-size="13">ESP32-WROOM-32</text>
<text x="430" y="470" text-anchor="middle" fill="#fff" font-size="12">DevKitC (30/38 ピン)</text>
<!-- left pins -->
<g font-size="13" font-weight="700">
<g><rect x="286" y="210" width="28" height="12" fill="#ffd23f"/><text x="270" y="221" text-anchor="end">3V3 → INMP441 VDD / PCA9685 VCC</text></g>
<g><rect x="286" y="240" width="28" height="12" fill="#ffd23f"/><text x="270" y="251" text-anchor="end">GND (共通)</text></g>
<g><rect x="286" y="270" width="28" height="12" fill="#ffd23f"/><text x="270" y="281" text-anchor="end">GPIO34 ← 電池電圧 (100k/33k 分圧)</text></g>
<g><rect x="286" y="300" width="28" height="12" fill="#ffd23f"/><text x="270" y="311" text-anchor="end">GPIO33 ← INMP441 SD (マイク音)</text></g>
<g><rect x="286" y="330" width="28" height="12" fill="#ffd23f"/><text x="270" y="341" text-anchor="end">GPIO25 → I2S WS/LRC</text></g>
<g><rect x="286" y="360" width="28" height="12" fill="#ffd23f"/><text x="270" y="371" text-anchor="end">GPIO26 → I2S SCK/BCLK</text></g>
<g><rect x="286" y="390" width="28" height="12" fill="#ffd23f"/><text x="270" y="401" text-anchor="end">GPIO27 → MAX98357A DIN</text></g>
<g><rect x="286" y="420" width="28" height="12" fill="#ffd23f"/><text x="270" y="431" text-anchor="end">VIN ← 5V (DC-DC から)</text></g>
</g>
<!-- right pins -->
<g font-size="13" font-weight="700">
<g><rect x="546" y="210" width="28" height="12" fill="#ffd23f"/><text x="590" y="221">GPIO21 → SDA (PCA9685 ×2)</text></g>
<g><rect x="546" y="240" width="28" height="12" fill="#ffd23f"/><text x="590" y="251">GPIO22 → SCL (PCA9685 ×2)</text></g>
<g><rect x="546" y="270" width="28" height="12" fill="#ffd23f"/><text x="590" y="281">GPIO16 (RX2) ← DFPlayer TX</text></g>
<g><rect x="546" y="300" width="28" height="12" fill="#ffd23f"/><text x="590" y="311">GPIO17 (TX2) → 1kΩ → DFPlayer RX</text></g>
<g><rect x="546" y="330" width="28" height="12" fill="#ffd23f"/><text x="590" y="341">GPIO4 → 74AHCT125 → LED DIN</text></g>
<g><rect x="546" y="360" width="28" height="12" fill="#ffd23f"/><text x="590" y="371">GND (共通)</text></g>
</g>
<text x="20" y="505" font-size="12" fill="#444">ピンの物理的な位置は基板の印字 (GPIO 番号) を見て合わせる。番号が正しければ場所はどこでもよい</text>
</svg>
