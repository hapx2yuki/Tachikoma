<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Zen Kaku Gothic New',sans-serif" font-size="14">
<rect width="900" height="360" fill="#fff"/>
<text x="20" y="32" font-weight="900" font-size="17">ヨーサーボの取り付け (横から見た断面)</text>
<rect x="60" y="180" width="500" height="20" fill="#bfc6d1" stroke="#1f2430" stroke-width="2"/><text x="580" y="195">シャーシプレート</text>
<rect x="200" y="200" width="40" height="0" fill="#fff"/>
<rect x="215" y="165" width="150" height="15" fill="#8b95a5" stroke="#1f2430" stroke-width="1"/><text x="580" y="172" font-size="12">台座ボス (高さ 3mm) — タブがここに座る</text>
<rect x="230" y="70" width="120" height="120" rx="4" fill="#2b2f3a" stroke="#1f2430" stroke-width="2"/><text x="290" y="130" text-anchor="middle" fill="#fff" font-weight="700">サーボ本体</text>
<rect x="215" y="150" width="15" height="15" fill="#555"/><rect x="350" y="150" width="15" height="15" fill="#555"/><text x="120" y="160" font-size="12">タブ (耳) ×2 → M3×10 ×4</text>
<rect x="255" y="190" width="70" height="30" fill="#4a4f5c" stroke="#1f2430" stroke-width="2"/><text x="580" y="215" font-size="12">ギヤヘッドはプレートの下へ突き出る</text>
<rect x="240" y="220" width="100" height="14" rx="4" fill="#ffd23f" stroke="#1f2430" stroke-width="2"/><text x="580" y="235" font-size="12">ホーン (下面側)</text>
<rect x="225" y="234" width="130" height="50" rx="6" fill="#2f6fd8" stroke="#1f2430" stroke-width="2"/><text x="290" y="265" text-anchor="middle" fill="#fff" font-weight="700">coxa 天板</text><text x="580" y="262" font-size="12">ホーンを coxa 天板のポケットへ埋めて M2.6 共締め</text>
<text x="20" y="320" font-size="13">つまり: サーボは「上から挿して」、脚は「下から吊り下がる」。プレート上面がすっきりして配線スペースになる</text>
<text x="20" y="342" font-size="12" fill="#555">4 個のサーボはケース長手を X 軸に平行・中央向きで揃える。脚の向き (15°/165°/210°/330°) はホーンの角度で決まる</text>
</svg>
