<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'Zen Kaku Gothic New',sans-serif" font-size="15">
<rect width="860" height="460" fill="#fff"/>
<rect x="40" y="90" width="200" height="260" rx="14" fill="#2b2f3a" stroke="#1f2430" stroke-width="3"/>
<text x="140" y="125" text-anchor="middle" fill="#fff" font-weight="900" font-size="18">ESP32 DevKitC</text>
<g fill="#ffd23f" font-weight="700" font-size="14"><text x="60" y="175">GPIO21 (SDA)</text><text x="60" y="215">GPIO22 (SCL)</text><text x="60" y="255">3V3</text><text x="60" y="295">GND</text></g>
<g stroke-width="4" fill="none">
<path d="M240,170 H420 M420,170 V190 M420,170 H660 M660,170 V190" stroke="#1d6fd8"/>
<path d="M240,210 H445 M445,210 V190 M445,210 H685 M685,210 V190" stroke="#27a86c"/>
<path d="M240,250 H470 M470,250 V190 M470,250 H710 M710,250 V190" stroke="#e5484d"/>
<path d="M240,290 H495 M495,290 V190 M495,290 H735 M735,290 V190" stroke="#1f2430"/>
</g>
<g stroke="#1f2430" stroke-width="3">
<rect x="380" y="60" width="180" height="130" rx="10" fill="#dff0ff"/>
<rect x="620" y="60" width="180" height="130" rx="10" fill="#dff0ff"/>
</g>
<g text-anchor="middle" font-weight="900"><text x="470" y="90" font-size="17">PCA9685 board0</text><text x="710" y="90" font-size="17">PCA9685 board1</text></g>
<g text-anchor="middle" font-size="14"><text x="470" y="112">脚 + 頭 (ch0-12)</text><text x="710" y="112">腕 + 目 (ch16-26)</text></g>
<g text-anchor="middle" font-weight="900" font-size="22"><text x="470" y="150" fill="#1d6fd8">0x40</text><text x="710" y="150" fill="#b3202a">0x41</text></g>
<g text-anchor="middle" font-size="12"><text x="470" y="172">A0 ジャンパ: 開放</text><text x="710" y="172">A0 ジャンパ: ハンダで閉じる</text></g>
<g font-size="11" text-anchor="middle"><text x="420" y="205">SDA</text><text x="445" y="228">SCL</text><text x="470" y="268">VCC</text><text x="495" y="308">GND</text></g>
<rect x="290" y="330" width="540" height="105" rx="12" fill="#fffbe6" stroke="#f2b233" stroke-width="2"/>
<text x="310" y="358" font-weight="900" font-size="15">同じ 4 本の線に 2 枚を「並列」でぶら下げる</text>
<text x="310" y="382" font-size="13">・SDA/SCL/VCC/GND を両方の基板の同名ピンへ。順番は関係ない (数珠つなぎでも OK)</text>
<text x="310" y="402" font-size="13">・ESP32 は「0x40 さん」「0x41 さん」と名前で呼び分ける。同じ名前が 2 枚あると衝突する</text>
<text x="310" y="422" font-size="13">・V+ (サーボ電源端子) にはここでは何もつながない</text>
</svg>
