<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Zen Kaku Gothic New',sans-serif" font-size="14">
<rect width="900" height="460" fill="#fff"/>
<rect x="0" y="380" width="900" height="80" fill="#e8e3d5"/><text x="20" y="440" font-size="12" fill="#666">作業台</text>
<g stroke="#1f2430" stroke-width="3"><rect x="60" y="280" width="120" height="100" fill="#8b95a5"/><rect x="40" y="250" width="160" height="34" rx="4" fill="#5b6472"/></g>
<text x="120" y="273" text-anchor="middle" fill="#fff" font-weight="700">バイス (万力)</text>
<rect x="150" y="205" width="90" height="50" rx="6" fill="#2f6fd8" stroke="#1f2430" stroke-width="2"/><text x="195" y="235" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">coxa</text>
<rect x="235" y="210" width="60" height="40" rx="4" fill="#2b2f3a"/><text x="265" y="235" text-anchor="middle" fill="#fff" font-size="11">股ピッチ</text>
<rect x="290" y="212" width="160" height="36" rx="6" fill="#ef6c2f" stroke="#1f2430" stroke-width="2"/><text x="370" y="236" text-anchor="middle" fill="#fff" font-weight="700">femur (水平)</text>
<rect x="440" y="205" width="50" height="50" rx="4" fill="#2b2f3a"/><text x="465" y="234" text-anchor="middle" fill="#fff" font-size="11">膝</text>
<rect x="475" y="240" width="34" height="120" rx="6" fill="#27a86c" stroke="#1f2430" stroke-width="2"/><text x="530" y="300" font-weight="700">tibia (真下)</text>
<circle cx="492" cy="368" r="12" fill="#666"/>
<path d="M492,380 V400" stroke="#1f2430" stroke-width="3"/>
<g transform="translate(492,420)"><rect x="-45" y="-20" width="90" height="40" rx="8" fill="#ffd23f" stroke="#1f2430" stroke-width="3"/><text y="6" text-anchor="middle" font-weight="900">1.2 kg</text></g>
<text x="492" y="395" text-anchor="middle" font-size="11" fill="#555">足先に吊る</text>
<path d="M600,330 C650,300 660,260 640,230" stroke="#1d6fd8" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#a)"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d6fd8"/></marker></defs>
<text x="620" y="360" fill="#1d6fd8" font-weight="900">持ち上がる?</text>
<rect x="640" y="40" width="240" height="150" rx="12" fill="#fffbe6" stroke="#f2b233" stroke-width="2"/>
<text x="660" y="70" font-weight="900" font-size="15">合格の条件 (3 つとも)</text>
<text x="660" y="98" font-size="13">☐ 1.2kg を股ピッチ+膝で持ち上げる</text>
<text x="660" y="122" font-size="13">☐ 6V 給電で保持電流 &lt; 1.5A / サーボ</text>
<text x="660" y="146" font-size="13">☐ スイープで干渉・ガタ・緩み無し</text>
<text x="660" y="175" font-size="12" fill="#b3202a">1 つでも NG なら残り 3 脚へ進まない</text>
<text x="20" y="40" font-weight="900" font-size="16">脚 1 本のベンチ試験</text>
<text x="20" y="64" font-size="12" fill="#555">総重量 3.0kg × 最悪時の脚負担 40% = 1.2kg 相当。これが歩行中に 1 本の脚にかかる重さ</text>
<g transform="translate(20,90)"><rect width="150" height="70" rx="8" fill="#fff" stroke="#1f2430" stroke-width="2"/><text x="75" y="28" text-anchor="middle" font-weight="700" font-size="13">電流計 (テスター)</text><text x="75" y="52" text-anchor="middle" font-size="12">サーボ電源の + 線に直列</text></g>
</svg>
